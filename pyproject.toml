[project]
name = "shortvideocli"
version = "0.1.0"
description = "AI-assisted viral short-video discovery and editing workflow"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pyrefly>=1.4.1",
    "pytest>=9.2.0",
    "typer>=0.29.1",
]

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]

[project.scripts]
shortvideocli = "shortvideocli.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shortvideocli"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
